[project]
name = "aisec"
version = "0.1.0"
description = "AI security validation agent: hypotheses from an LLM, verdicts from deterministic oracles."
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "flask",
    "httpx",
    "pytest",
    "pyyaml",
]

[project.scripts]
aisec = "aisec.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aisec*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
